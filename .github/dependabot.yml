version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps; majors still come one by one.
      pub-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Flutter SDK is pinned (3.16.4, Dart 3.2) in CI and the Dockerfile,
      # so versions that need a newer SDK cannot resolve or compile.
      # flutter_localizations pins intl to the exact version in pubspec.yaml.
      - dependency-name: "intl"
      # Latest majors (cupertino_icons 2, flutter_lints 6, http 1.6,
      # flutter_secure_storage 11, font_awesome_flutter 11) require Dart
      # 3.4+ and some Flutter 3.19+/3.27+, and responsive_framework 1 and
      # dart_jsonwebtoken 3 need code migration. Revisit when Flutter is bumped.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
