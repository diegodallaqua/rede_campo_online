name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the base image in the Dockerfile.
  FLUTTER_VERSION: "3.16.4"
  # Placeholder: CI only checks that the build compiles. The real URL is
  # configured in the deploy service (Railway), never committed here.
  API_BASE_URL: "https://api.example.invalid"

jobs:
  flutter:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runs before codegen so the generated *.g.dart files are not checked.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate code (MobX)
        run: dart run build_runner build --delete-conflicting-outputs

      # Infos (naming of API fields) are reported but do not fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: >
          flutter build web --release -t lib/app/main.dart
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            API_BASE_URL=${{ env.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
